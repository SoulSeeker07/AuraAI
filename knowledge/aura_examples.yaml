# ============================================================
#  Aura Natural Language Examples
#  Maps user utterances → capability → planner → backend.
#  Used for few-shot LLM grounding and planner training.
#
#  Current count: 200+ examples (target: 400+)
#  Each example teaches Aura how to route a user request.
#  This file grows over time — it becomes Aura's "experience."
# ============================================================

# Format:
#   user_says:   the natural language utterance
#   capability:  the canonical capability ID
#   planner:     which planner handles execution
#   backend:     which backend executes it
#   notes:       (optional) additional context

examples:

