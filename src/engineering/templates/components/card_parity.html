<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; font-family: 'Segoe UI', Inter, -apple-system, sans-serif; }
    #card-parity {
      width: 400px;
      height: 180px;
      background: rgba(22, 28, 40, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 8px;
    }
    .hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 14px;
      font-weight: bold;
      color: #f3f6fc;
      line-height: 1.2;
    }
    .badge {
      font-family: Consolas, monospace;
      font-size: 10px;
      font-weight: bold;
      background: rgba(0, 229, 255, 0.15);
      color: #00e5ff;
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 4px;
      padding: 2px 6px;
    }
    .sub {
      font-size: 12px;
      color: #a5b4cb;
      line-height: 1.4;
    }
  </style>
</head>
<body class="p-0 m-0">
  <div id="card-parity">
    <div class="hdr">
      <span class="title">Neural Agent Dispatcher</span>
      <span class="badge">AUTONOMOUS</span>
    </div>
    <div class="sub">
      The AuraAI agent ecosystem operates on top of native design tokens.
    </div>
  </div>
</body>
</html>
