<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capability Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d12;
    color: #c8c8d4;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    padding: 16px;
    min-height: 100vh;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 16px;
  }
  .arc-container {
    position: relative;
    width: 80px;
    height: 80px;
    flex-shrink: 0;
  }
  .arc-container svg { position: absolute; top: 0; left: 0; }
  .arc-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px;
    font-weight: 700;
    color: #7c3aed;
  }
  .coverage-info h2 {
    font-size: 18px;
    font-weight: 700;
    color: #e0e0f0;
    margin-bottom: 4px;
  }
  .sub { color: #6b6b8a; font-size: 12px; }
  .stale-badge {
    display: none;
    background: rgba(239,68,68,0.15);
    color: #ef4444;
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 11px;
    margin-left: 8px;
  }
  .tables { display: flex; gap: 16px; margin-top: 12px; }
  .table-col { flex: 1; min-width: 0; }
  .table-col h3 {
    font-size: 11px;
    font-weight: 600;
    color: #9090b0;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(124,58,237,0.15);
  }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 3px 4px; vertical-align: middle; }
  tr { border-bottom: 1px solid rgba(255,255,255,0.04); }
  .cap-name { color: #c0c0d8; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap-name.never { color: #ef4444; opacity: 0.75; }
  .cap-val { text-align: right; color: #7c3aed; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .badge {
    display: inline-block;
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 10px;
    font-weight: 600;
    margin-left: 4px;
    vertical-align: middle;
  }
  .badge-low { background: rgba(52,211,153,0.15); color: #34d399; }
  .badge-medium { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .badge-high { background: rgba(239,68,68,0.15); color: #ef4444; }
  .badge-critical { background: rgba(239,68,68,0.3); color: #ff6b6b; }
  footer {
    margin-top: 14px;
    color: #40405a;
    font-size: 10px;
    text-align: right;
  }
</style>
</head>
<body>
<div class="header">
  <div class="arc-container">
    <svg width="80" height="80" viewBox="0 0 80 80">
      <circle cx="40" cy="40" r="30" fill="none" stroke="#1a1a2e" stroke-width="8"/>
      <circle id="arc" cx="40" cy="40" r="30" fill="none"
        stroke="#7c3aed" stroke-width="8"
        stroke-dasharray="0 188.5"
        stroke-linecap="round"
        transform="rotate(-90 40 40)"
        style="transition: stroke-dasharray 0.5s ease;"/>
    </svg>
    <div class="arc-label" id="arc-pct">--%</div>
  </div>
  <div class="coverage-info">
    <h2>Capability Coverage <span class="stale-badge" id="stale-badge">stale</span></h2>
    <div class="sub" id="cov-sub">Loading...</div>
  </div>
</div>

<div class="tables">
  <div class="table-col">
    <h3>Least Used</h3>
    <table><tbody id="least-body"></tbody></table>
  </div>
  <div class="table-col">
    <h3>Last Used</h3>
    <table><tbody id="recent-body"></tbody></table>
  </div>
</div>

<footer id="footer">--</footer>

<script>
const POLL_MS = 3000;
const CIRC = 2 * Math.PI * 30;

let lastData = null;

function fmtId(id) {
  return (id || '').replace(/\./g, ' \u203a ');
}

function fmtAgo(ts) {
  if (!ts) return 'never';
  const d = (Date.now() / 1000) - ts;
  if (d < 60) return Math.floor(d) + 's ago';
  if (d < 3600) return Math.floor(d / 60) + 'm ago';
  if (d < 86400) return Math.floor(d / 3600) + 'h ago';
  return Math.floor(d / 86400) + 'd ago';
}

function riskBadge(risk) {
  if (!risk) return '';
  const cls = 'badge badge-' + risk.toLowerCase();
  return '<span class="' + cls + '">' + risk.toUpperCase() + '</span>';
}

function renderRow(name, value, never, risk) {
  const nameClass = 'cap-name' + (never ? ' never' : '');
  return '<tr><td class="' + nameClass + '">' + fmtId(name) + riskBadge(risk) + '</td><td class="cap-val">' + value + '</td></tr>';
}

function render(data) {
  lastData = data;
  const cov = data.coverage || {};
  const pct = cov.coverage_pct || 0;
  const used = cov.used_at_least_once || 0;
  const total = cov.total_registered || 0;
  const never = cov.never_used || 0;

  const filled = (pct / 100) * CIRC;
  document.getElementById('arc').setAttribute(
    'stroke-dasharray', filled.toFixed(1) + ' ' + (CIRC - filled).toFixed(1)
  );
  document.getElementById('arc-pct').textContent = pct + '%';
  document.getElementById('cov-sub').textContent =
    used + ' of ' + total + ' capabilities used \u2022 ' + never + ' never touched';

  document.getElementById('least-body').innerHTML =
    (data.least_used || []).map(function(r) {
      return renderRow(r.capability_id, r.usage_count + 'x', r.usage_count === 0, r.last_risk_level);
    }).join('');

  document.getElementById('recent-body').innerHTML =
    (data.most_recent || []).map(function(r) {
      return renderRow(r.capability_id, fmtAgo(r.last_used_at), false, r.last_risk_level);
    }).join('');

  const genAt = data.generated_at ? new Date(data.generated_at * 1000).toLocaleTimeString() : '--';
  document.getElementById('footer').textContent = 'Last updated: ' + genAt;
  document.getElementById('stale-badge').style.display = 'none';
}

async function poll() {
  try {
    const resp = await fetch('dashboard.json', { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    render(await resp.json());
  } catch (e) {
    console.warn('Capability dashboard poll failed:', e);
    if (lastData) {
      document.getElementById('stale-badge').style.display = 'inline-block';
    } else {
      document.getElementById('cov-sub').textContent = 'Dashboard unavailable (' + e.message + ')';
    }
  }
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
