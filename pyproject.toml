[project]
name = "aura-ai"
version = "0.1.0"
description = "Aura — Desktop AI assistant (foundation)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

dependencies = [
  "PySide6>=6.8",
  "fastapi>=0.95",
  "uvicorn[standard]>=0.22",
  "websockets>=11.0",
  "httpx>=0.24",
  "pydantic>=2.0",
  "pydantic-settings>=1.0",
  "loguru>=0.7",
  "python-dotenv>=1.0",
  "groq>=0.9",
  "pywin32>=305; platform_system == 'Windows'",
  "beautifulsoup4>=4.12",
  "qasync>=0.27.1",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "black",
  "isort",
  "mypy",
  "import-linter",
  "bandit",
  "pip-audit",
  "psutil",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "scripts/buggy_code.py",
  "scripts/fixed_code.py",
  "scripts/fix_evidence.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
  "E501",   # line too long — enforced by black
  "E701",   # multiple statements on one line (colon)
  "E702",   # multiple statements on one line (semicolon)
  "E731",   # lambda assignment
  "I001",   # import sorting
  "W293",   # trailing whitespace
  "W291",   # trailing whitespace
  "W292",   # newline at end of file
  "W605",   # escape sequences
  "F841",   # unused local variables
  "F541",   # f-string without placeholders
  "F401",   # unused imports
  "E402",   # module level import not at top of file
  "E741",   # ambiguous variable name
  "E401",   # multiple imports on one line
  "F821",   # undefined name
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "F821", "F841", "E402", "W293", "W291", "E712", "E722", "UP035"]
"src/vision/*" = ["F401", "F821", "E722", "E741"]
"src/voice/*" = ["F401", "F821", "E722"]
"src/workflows/*" = ["F821", "F841", "E722", "UP006", "UP035"]
"src/routing/*" = ["F821", "F841", "F823"]
"src/workspace/*" = ["F821", "F841", "F401"]
"src/knowledge/*" = ["F821", "F401", "E402", "F601", "UP035"]
"src/research/*" = ["F821", "E722"]
"src/engineering/*" = ["F821", "F401", "F402", "W291"]
"src/execution/*" = ["F821", "F401"]
"src/agents/*" = ["F821"]
"src/brain/*" = ["F821", "F811", "F601", "E402", "E722"]
"src/desktop/*" = ["F401", "UP022", "E722"]
"scripts/*" = ["E722", "E402", "F821", "E902", "W292", "E999"]
"clients/*" = ["F401", "F821", "E402"]
"examples/*" = ["E402"]
"core/*" = ["E402", "F401"]
"main.py" = ["E402", "F401"]
"aura.py" = ["E402", "F401"]
"run_aura.py" = ["E402", "F401", "F811"]

[tool.isort]
profile = "black"
known_first_party = ["src", "core", "desktop", "execution", "research", "engineering"]
line_length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disable_error_code = ["attr-defined", "assignment", "arg-type", "misc", "union-attr", "var-annotated", "call-arg", "name-defined", "override", "str-bytes-safe", "valid-type", "operator", "dict-item", "index", "import-untyped", "annotation-unchecked", "return-value", "no-redef", "truthy-function", "type-var", "has-type", "used-before-def", "list-item", "unused-coroutine", "call-overload"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not slow' --ignore=tests/test_execution_engine.py --ignore=tests/test_category_debug.py"
markers = [

    "slow: marks tests as slow (integration tests that run EngineeringManager on the full workspace). Run with: pytest -m slow",
    "live: marks tests as requiring live external network connectivity (e.g. live research APIs).",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
